<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Notes</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:dark;
  --bg:#121212;--card:#1b1b1b;--ink:#b8b8b8;--sub:#767676;--line:#2a2a2a;
  --accent:#3a3a3a;--accent-ink:#d0d0d0;--soft:#222;--ok:#8a9a8a;--okbg:#1b1f1b;
  --warn:#a39a85;--warnbg:#201f1b;--bad:#9a6a6a;--badbg:#241c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;color:var(--sub);padding:11px 0;font:inherit;font-size:13px}

#tabs button.on{color:var(--accent);font-weight:700}
h1{font-size:15px;font-weight:600;margin:4px 0 12px;color:var(--ink)}
h2{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--sub)}
.sub{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 10px;font:inherit;text-align:left}
.chip.on{border-color:#555;background:#262626;color:#ddd}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:10px;font:inherit}
.seg button.on{background:#2e2e2e;color:#ddd}
.btn{border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:11px 14px;font:inherit;font-weight:500;width:100%}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:none;color:var(--sub);font-weight:500}
.btn:disabled{opacity:.5}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px}
.link{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;padding:4px}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}
input[type=range]{width:100%}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.bubble{max-width:86%;padding:8px 11px;border-radius:8px;position:relative;white-space:pre-wrap;word-break:break-word}
.bubble.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:2px}
.bubble.me{background:#262626;color:#c8c8c8;align-self:flex-end;border-bottom-right-radius:2px}
.bubble .mini{margin-top:6px;display:inline-block}
.coach{align-self:flex-end;max-width:92%;background:var(--warnbg);color:var(--ink);border-radius:12px;padding:8px 11px;font-size:14px}
.coach.ok{background:var(--okbg);color:var(--ok)}
.coach summary{cursor:pointer;font-weight:600}
.coach .qa{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.coach .qa .q{font-weight:600;margin-bottom:2px}
.coach .ex{margin-top:6px}
.coach .askBtn{margin-top:8px}
.mk{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}
.mk-g{text-decoration-color:#e06c6c}
.mk-e{text-decoration-color:#5ea0e6}
.ph{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.coach .askForm{margin-top:8px}
.coach .askForm input{padding:9px 10px;font-size:14px}
.coach b{display:block;margin-bottom:2px}
.coach .sub{white-space:pre-wrap}
#bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:12px 0 2px;display:flex;flex-direction:column;gap:8px;align-items:center}
.mic{min-width:120px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);font:inherit;font-size:14px}
.mic.rec{background:#3a2a2a;color:#c9a5a5}
.mic:disabled{opacity:.5}

.status{font-size:13px;color:var(--sub);min-height:20px}
/* toeic */
.qcard{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px;margin-bottom:8px;font:inherit}
.qcard b{font-size:15px}
.pre{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font-size:15px}
.big{font-size:19px;line-height:1.6}
.timer{font-size:40px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:#666;transition:width .15s linear}
.bar.rec i{background:#8a5a5a}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:500;font-size:12px;background:var(--soft);color:var(--ink)}
.badge.hi{background:var(--okbg);color:var(--ok)}
.badge.lo{background:var(--badbg);color:var(--bad)}
.quote{border-left:3px solid var(--line);padding:2px 10px;color:var(--ink);margin:6px 0;white-space:pre-wrap}
ul.tight{margin:4px 0 8px;padding-left:20px}
ul.tight li{margin:2px 0}
details{margin:6px 0}
details summary{cursor:pointer;font-weight:600}
.center{text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:#777;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a2a2a;color:#bbb;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .card{width:100%;max-width:380px;margin:0}
label.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="talk">회화</button>
    <button data-tab="toeic">토스</button>
    <button data-tab="log">기록</button>
    <button data-tab="settings">설정</button>
  </nav>
</div>
<div id="toast"></div>
<div id="login" class="modal hidden">
  <div class="card">
    <h1>Notes</h1>
    <p class="sub">설정해 둔 앱 비밀번호를 입력하세요.</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div style="height:10px"></div>
    <button class="btn" id="pwGo">시작하기</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────── 유틸 ───────────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ───────────── 설정 ───────────── */
const settings = Object.assign({ autoRead: true, rate: 0.95, voiceURI: '', hideText: false, level: 'intermediate' }, store.get('ec_settings', {}));
const saveSettings = () => store.set('ec_settings', settings);
let password = store.get('ec_pw', '');

/* ───────────── API ───────────── */
async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-app-password': password },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({ error: r.status === 413 ? '녹음이 너무 길어요.' : '서버 응답을 읽을 수 없어요.' }));
  if (!r.ok) {
    if (r.status === 401) showLogin();
    throw new Error(data.error || `오류 (${r.status})`);
  }
  return data;
}

/* ───────────── 오디오: TTS / 비프 / 녹음 ───────────── */
let actx = null;
function audioCtx() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function unlockAudio() {
  audioCtx();
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
  } catch {}
}
async function beep() {
  const c = audioCtx();
  if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.value = 880; g.gain.value = 0.08;
  o.connect(g); g.connect(c.destination); o.start();
  await sleep(170); o.stop(); await sleep(60);
}

const TTS = {
  voices: [],
  load() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
    if (vs.length) this.voices = vs;
  },
  pick() {
    if (settings.voiceURI) { const v = this.voices.find((x) => x.voiceURI === settings.voiceURI); if (v) return v; }
    const prefs = [/Google US English/i, /Samantha/i, /Aria|Jenny|Ava|Allison/i, /Daniel|Aaron|Guy/i];
    for (const p of prefs) { const v = this.voices.find((x) => p.test(x.name) && /en[-_]US/i.test(x.lang)); if (v) return v; }
    return this.voices.find((v) => /en[-_]US/i.test(v.lang)) || this.voices[0] || null;
  },
  speak(text) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window) || !text) return resolve();
      try { speechSynthesis.cancel(); } catch {}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = settings.rate;
      const v = this.pick();
      if (v) u.voice = v;
      let done = false;
      const fin = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
      const words = text.split(/\s+/).length;
      const guard = setTimeout(fin, (words / 2.2 / settings.rate + 4) * 1000); // onend가 안 오는 브라우저 대비
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    });
  },
  cancel() { try { speechSynthesis.cancel(); } catch {} },
};
if ('speechSynthesis' in window) { TTS.load(); speechSynthesis.onvoiceschanged = () => TTS.load(); }

let micStream = null;
async function getMic() {
  if (micStream && micStream.getTracks().every((t) => t.readyState === 'live')) return micStream;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('마이크를 쓸 수 없어요. HTTPS 주소로 접속했는지 확인해 주세요.');
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch {
    throw new Error('마이크 권한이 필요해요. 브라우저 설정에서 허용해 주세요.');
  }
  return micStream;
}
function releaseMic() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
}

async function startRecorder(maxSec, onTick) {
  const stream = await getMic();
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  const t0 = Date.now();
  let stopped = false, resolveDone;
  const done = new Promise((r) => (resolveDone = r));
  let iv = null;
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    clearInterval(iv);
    resolveDone({ blob: new Blob(chunks, { type: mr.mimeType || mime || 'audio/webm' }), durationSec: (Date.now() - t0) / 1000 });
  };
  const stop = () => { if (!stopped) { stopped = true; if (mr.state !== 'inactive') mr.stop(); } };
  iv = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    if (onTick) onTick(s);
    if (s >= maxSec) stop();
  }, 150);
  mr.start();
  return { stop, done };
}

function decodeAudio(ctx, buf) {
  return new Promise((res, rej) => {
    const p = ctx.decodeAudioData(buf, res, rej);
    if (p && p.catch) p.catch(rej);
  });
}
function bytesToBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
// 어떤 브라우저 포맷(webm/mp4)이든 16kHz 모노 WAV로 통일 → Gemini가 확실히 읽는 형식
async function toWavBase64(blob) {
  const ctx = audioCtx();
  const buf = await decodeAudio(ctx, await blob.arrayBuffer());
  const rate = 16000;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new OAC(1, Math.max(1, Math.ceil(buf.duration * rate)), rate);
  const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start(0);
  const out = await off.startRendering();
  const f32 = out.getChannelData(0);
  const n = f32.length;
  let peak = 0;
  for (let i = 0; i < n; i++) { const a = Math.abs(f32[i]); if (a > peak) peak = a; }
  const gain = peak > 0.005 && peak < 0.3 ? Math.min(6, 0.8 / peak) : 1; // 작은 목소리 보정
  const wav = new ArrayBuffer(44 + n * 2), v = new DataView(wav);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, f32[i] * gain));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return bytesToBase64(new Uint8Array(wav));
}
async function transcribe(blob, reference) {
  const audio = await toWavBase64(blob);
  return api('/api/transcribe', { audio, mime: 'audio/wav', reference: reference || '' });
}

/* ───────────── 기록 저장 ───────────── */
const history = () => store.get('ec_history', []);
function addHistory(entry) {
  const h = history();
  h.unshift({ ...entry, date: new Date().toISOString() });
  store.set('ec_history', h.slice(0, 100));
}
const phrases = () => store.get('ec_phrases', []);
function addPhrases(list) {
  const cur = phrases();
  for (const p of list || []) {
    if (!p || !p.en || !p.en.trim()) continue;
    if (cur.some((x) => x.en.toLowerCase() === p.en.trim().toLowerCase())) continue;
    cur.unshift({ en: p.en.trim(), ko: (p.ko || '').trim(), date: new Date().toISOString() });
  }
  store.set('ec_phrases', cur.slice(0, 300));
}

const MAX_CONVS = 10;
const convs = () => store.get('ec_convs', []);
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function persistTalk() {
  if (!talk.id) return;
  const msgs = talk.msgs.map((m) => { const c = { ...m }; delete c.askBusy; delete c.askOpen; return c; });
  if (!msgs.some((m) => m.role === 'user')) return;
  const list = convs().filter((c) => c.id !== talk.id);
  list.unshift({ id: talk.id, scenario: talk.scenario, level: talk.level, msgs, review: talk.review || null, updated: new Date().toISOString() });
  store.set('ec_convs', list.slice(0, MAX_CONVS));
}
const isSaved = (en) => phrases().some((x) => x.en.toLowerCase() === String(en || '').trim().toLowerCase());
const saveBtn = (en, ko) => (isSaved(en) ? '<button class="mini" disabled>저장됨</button>' : `<button class="mini" data-act="savePhrase" data-en="${esc(en)}" data-ko="${esc(ko)}">노트에 저장</button>`);

/* ───────────── 라우터 ───────────── */
const view = $('#view');
let tab = 'talk';
function go(t) {
  if (tab === 'toeic' && t !== 'toeic' && toeic.sess) abortToeic();
  if (tab === 'talk' && t !== 'talk') { TTS.cancel(); talkStopRec(); }
  tab = t;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  render();
}
function render() {
  ({ talk: renderTalk, toeic: renderToeic, log: renderLog, settings: renderSettings })[tab]();
}
function showLogin() { $('#login').classList.remove('hidden'); setTimeout(() => $('#pw').focus(), 50); }

/* ═══════════════ 일상 회화 ═══════════════ */
const SCENARIOS = [
  { id: 'free', ico: '', name: '자유 대화' },
  { id: 'smalltalk', ico: '', name: '스몰토크' },
  { id: 'work', ico: '', name: '업무·연구 이야기' },
  { id: 'cafe', ico: '', name: '카페·식당' },
  { id: 'travel', ico: '', name: '여행' },
  { id: 'service', ico: '', name: '문의·불만 처리' },
  { id: 'interview', ico: '', name: '면접' },
];
const LEVELS = [{ id: 'beginner', name: '초급' }, { id: 'intermediate', name: '중급' }, { id: 'advanced', name: '고급' }];
const talk = { phase: 'setup', scenario: 'free', level: settings.level, msgs: [], status: 'idle', rec: null, hints: null, review: null };

function renderTalk() {
  const t = talk;
  if (t.phase === 'setup') {
    view.innerHTML = `
      <h1>일상 회화 연습</h1>
      <p class="sub">마이크 버튼으로 말하면 AI가 대답하고, 내 문장은 더 자연스럽게 고쳐줘요.</p>
      <h2>상황</h2>
      <div class="grid">${SCENARIOS.map((s) => `<button class="chip ${t.scenario === s.id ? 'on' : ''}" data-act="scn" data-id="${s.id}">${s.name}</button>`).join('')}</div>
      <h2>난이도</h2>
      <div class="seg">${LEVELS.map((l) => `<button class="${t.level === l.id ? 'on' : ''}" data-act="lvl" data-id="${l.id}">${l.name}</button>`).join('')}</div>
      <div style="height:18px"></div>
      <button class="btn" data-act="talkStart">대화 시작</button>
      ${recentHTML()}`;
    return;
  }
  if (t.phase === 'review') {
    const r = t.review;
    view.innerHTML = `
      <h1>대화 리뷰</h1>
      ${!r ? `<div class="card center"><span class="spin"></span><p class="sub">리뷰 만드는 중…</p></div>` : `
      <div class="card"><p style="margin:0">${esc(r.overall_ko)}</p></div>
      ${r.strengths_ko.length ? `<h2>잘한 점</h2><div class="card"><ul class="tight">${r.strengths_ko.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.mistakes.length ? `<h2>고칠 표현</h2>${r.mistakes.map((m) => `<div class="card"><div class="sub">내가 한 말</div><div>${esc(m.original)}</div><div class="sub" style="margin-top:6px">더 좋은 표현</div><div><b>${esc(m.better)}</b> <button class="mini" data-act="say" data-text="${esc(m.better)}">듣기</button> ${saveBtn(m.better, '내 문장: ' + m.original)}</div><div class="sub" style="margin-top:4px">${esc(m.why_ko)}</div></div>`).join('')}` : ''}

  marks.forEach((mk, k) => {

const OPENERS = {
  free: ["Hi! What's something you're looking forward to this week?", "Hey there. How was your day so far?", "Hello! What did you do last weekend?", "Hi! If you could take tomorrow off, what would you do?", "Hey! Have you watched or read anything interesting lately?", "Hi there. What's been on your mind today?"],

function pickOpener(scn) {
  const pool = OPENERS[scn] || OPENERS.free;
  const last = store.get('ec_last_open', {});
  let i = Math.floor(Math.random() * pool.length);
  if (pool.length > 1 && i === last[scn]) i = (i + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
  last[scn] = i; store.set('ec_last_open', last);
  return pool[i];
}

async function talkMic() {

  if (t.status === 'recording') { if (t.rec) t.rec.stop(); return; }
  if (t.status !== 'idle') return;
  try {
    unlockAudio();
    t.hints = null;
    t.rec = await startRecorder(75, (s) => { const el = $('#status'); if (el) el.textContent = `녹음 중 ${s.toFixed(0)}초 — 끝나면 완료를 누르세요`; });

    t.rec = null;
    if (durationSec < 0.8) { toast('너무 짧아요. 다시 말해 주세요.'); talkSetStatus('idle'); return; }
    talkSetStatus('thinking');
    const tr = await transcribe(blob, '');
    if (!tr.speech_detected) { toast('목소리가 잘 안 들렸어요. 다시 말해 주세요.'); talkSetStatus('idle'); return; }
    await talkSend(tr.transcript, { pronunciation_issues: tr.pronunciation_issues, delivery_ko: tr.delivery_ko });

  }
  let panel = '';
  if (st.stage === 'reading') panel = `<div class="sub center">자료를 읽어 두세요</div>${timerHTML('자료 읽기')}<button class="btn sec" data-act="skip">바로 시작</button>`;
  else if (st.stage === 'prep') panel = `${timerHTML('준비 시간')}<button class="btn sec" data-act="skip">바로 녹음</button>`;
  else if (st.stage === 'rec') panel = `${timerHTML('녹음 중', true)}<button class="btn" style="background:#3a2a2a;color:#c9a5a5" data-act="stopRec">답변 끝내기</button>`;
  view.innerHTML = `
    <div class="rowb" style="margin-bottom:8px"><b>${cfg.label.split(' ')[0]}${st.stage === 'reading' || st.stage === 'listen' ? '' : ` · ${st.i + 1}/${set.items.length}`}</b><button class="link" data-act="abort">중단</button></div>
    <div class="card">${body}</div>${panel ? `<div class="card">${panel}</div>` : ''}`;
}
function timerHTML(label, rec) {
  return `<div class="sub center">${label}</div><div class="timer" id="cdNum">–</div><div class="bar ${rec ? 'rec' : ''}"><i id="cdBar"></i></div>`;
}
function updateCd(left, total) {
  const n = $('#cdNum'), b = $('#cdBar');
  if (n) n.textContent = Math.max(0, Math.ceil(left));
  if (b) b.style.width = Math.max(0, Math.min(100, (left / total) * 100)) + '%';
}
function setRun(stage, i) { runState = { stage, i: i == null ? runState.i : i }; if (tab === 'toeic' && toeic.phase === 'run') renderRun(); }
function checkCancel(s) { if (s.cancelled) throw new Error('cancelled'); }
function countdown(s, sec) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    updateCd(sec, sec);
    const iv = setInterval(() => {
      if (s.cancelled) { clearInterval(iv); return reject(new Error('cancelled')); }
      const left = sec - (Date.now() - t0) / 1000;
      updateCd(left, sec);
      if (left <= 0) { clearInterval(iv); resolve(); }
    }, 150);
    s.skip = () => { clearInterval(iv); resolve(); };
  });
}
async function recordFor(s, limit) {
  const rec = await startRecorder(limit, (sec) => updateCd(limit - sec, limit));
  s.stopRec = rec.stop;
  updateCd(limit, limit);
  const r = await rec.done;
  s.stopRec = null;
  return r;
}
function processAnswer(s, i, rec, limit, reference) {
  return (async () => {
    try {
      if (rec.durationSec < 0.8) return { index: i, speech_detected: false, transcript: '', duration_sec: rec.durationSec, limit_sec: limit };
      const tr = await transcribe(rec.blob, reference);
      return { index: i, ...tr, duration_sec: rec.durationSec, limit_sec: limit };
    } catch (e) {
      return { index: i, error: e.message, speech_detected: false, transcript: '', duration_sec: rec.durationSec, limit_sec: limit };
    }
  })();
}

async function toeicStart(type) {
  const s = { type, cfg: TOEIC_TYPES[type], set: null, cancelled: false, skip: null, stopRec: null, answers: [] };
  toeic.sess = s;
  toeic.phase = 'loading'; renderToeic();
  try {
    const set = await api('/api/claude', { task: 'toeic_generate', type });
    if (toeic.sess !== s) return; // 생성 중 다른 탭으로 나간 경우
    s.set = set;
    toeic.phase = 'intro';
  } catch (e) {
    if (toeic.sess !== s) return;
    toast(e.message); toeic.phase = 'home'; toeic.sess = null;
  }
  if (tab === 'toeic') renderToeic();
}
function abortToeic() {
  const s = toeic.sess;
  if (s) { s.cancelled = true; if (s.skip) s.skip(); if (s.stopRec) s.stopRec(); }
  TTS.cancel(); releaseMic();
  toeic.sess = null; toeic.phase = 'home';
}
async function toeicGo() {
  const s = toeic.sess, cfg = s.cfg, set = s.set;
  unlockAudio();
  try { await getMic(); } catch (e) { toast(e.message); return; }
  toeic.phase = 'run';
  try {
    if (s.type === 'info') { setRun('reading', 0); await countdown(s, cfg.reading); checkCancel(s); }
    if (s.type === 'solution') { setRun('listen', 0); await TTS.speak(set.material); checkCancel(s); }
    for (let i = 0; i < set.items.length; i++) {
      const item = set.items[i], lim = cfg.items[i];
      setRun('q', i);
      if (cfg.speakPrompt) { await TTS.speak(item.text); checkCancel(s); }
      if (lim.prep > 0) { setRun('prep', i); await countdown(s, lim.prep); checkCancel(s); }
      await beep(); checkCancel(s);
      setRun('rec', i);
      const rec = await recordFor(s, lim.resp);
      checkCancel(s);
      s.answers[i] = processAnswer(s, i, rec, lim.resp, s.type === 'read_aloud' ? item.text : '');
      await sleep(250);
    }
  } catch (e) {
    if (e.message !== 'cancelled') toast(e.message);
    if (toeic.sess === s) abortToeic();
    if (tab === 'toeic') renderToeic();
    return;
  }
  releaseMic();
  toeic.phase = 'grading'; renderToeic();
  try {
    const answers = await Promise.all(s.answers);
    const res = await api('/api/claude', {
      task: 'toeic_evaluate', type: s.type,
      set: { context: set.context, material: set.material, items: set.items },
      answers: answers.map((a) => ({ speech_detected: a.speech_detected, transcript: a.transcript, duration_sec: a.duration_sec, limit_sec: a.limit_sec, delivery: { pronunciation_issues: a.pronunciation_issues, delivery_ko: a.delivery_ko, reference_diff: a.reference_diff } })),
    });
    toeic.result = { type: s.type, set, answers, res };
    const sum = res.items.reduce((a, b) => a + b.score, 0), max = res.items.reduce((a, b) => a + b.max, 0);
    addHistory({ kind: 'toeic', type: s.type, label: s.cfg.label, sum, max, confidence: res.confidence_pct });
    toeic.phase = 'result';
  } catch (e) { toast(e.message); toeic.phase = 'home'; }
  toeic.sess = null;
  if (tab === 'toeic') renderToeic();
}

function renderResult() {
  const { type, set, answers, res } = toeic.result;
  const cfg = TOEIC_TYPES[type];
  const sum = res.items.reduce((a, b) => a + b.score, 0), max = res.items.reduce((a, b) => a + b.max, 0);
  view.innerHTML = `
    <h1>결과 · ${cfg.label.split(' ')[0]}</h1>
    <div class="card">
      <div class="rowb"><b style="font-size:22px">${sum} / ${max}</b><span class="badge">채점 신뢰도 약 ${res.confidence_pct}%</span></div>
      <p style="margin:8px 0 0">${esc(res.overall_ko)}</p>
      <p class="sub" style="margin:8px 0 0">※ 녹음이 아닌 인식된 텍스트와 AI의 발음 메모를 바탕으로 한 예상 점수예요. 실제 ETS 채점과는 차이가 있을 수 있어요.</p>
    </div>
    ${res.priorities_ko.length ? `<h2>우선 개선 포인트</h2><div class="card"><ol class="tight">${res.priorities_ko.map((p) => `<li>${esc(p)}</li>`).join('')}</ol></div>` : ''}
    ${res.items.map((it, i) => resultItem(it, answers[i] || {}, set.items[i], i)).join('')}
    <button class="btn" data-act="toeicHome">다시 연습하기</button>`;
  view.scrollTop = 0;
}
function resultItem(it, a, q, i) {
  const ratio = it.score / it.max;
  const cls = ratio >= 0.8 ? 'hi' : ratio <= 0.4 ? 'lo' : '';
  const words = (a.transcript || '').trim() ? a.transcript.trim().split(/\s+/).length : 0;
  const wpm = a.duration_sec > 2 ? Math.round(words / (a.duration_sec / 60)) : 0;
  const d = a.pronunciation_issues || [];
  return `<div class="card">
    <div class="rowb"><b>Q${i + 1}</b><span class="badge ${cls}">${it.score} / ${it.max}</span></div>
    <div class="sub" style="margin-top:6px">${esc(q.text).slice(0, 140)}${q.text.length > 140 ? '…' : ''}</div>
    <div class="sub" style="margin-top:8px">AI가 들은 내 답변</div>
    <div class="quote">${a.transcript ? esc(a.transcript) : '(인식된 음성이 없어요' + (a.error ? ': ' + esc(a.error) : '') + ')'}</div>
    <div class="sub">${Math.round(a.duration_sec || 0)}초 / ${a.limit_sec}초${wpm ? ` · 약 ${wpm} wpm` : ''}</div>
    ${it.strengths_ko.length ? `<div style="margin-top:8px"><b>좋은 점</b><ul class="tight">${it.strengths_ko.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${it.fixes_ko.length ? `<div><b>고칠 점</b><ul class="tight">${it.fixes_ko.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${it.pronunciation_ko || d.length || a.delivery_ko ? `<details><summary>발음·전달</summary>${it.pronunciation_ko ? `<p style="margin:4px 0">${esc(it.pronunciation_ko)}</p>` : ''}${a.delivery_ko ? `<p class="sub" style="margin:4px 0">${esc(a.delivery_ko)}</p>` : ''}${d.map((p) => `<div class="sub"><b>${esc(p.word)}</b> – ${esc(p.issue_ko)}</div>`).join('')}${(a.reference_diff || []).length ? `<div class="sub" style="margin-top:4px">원문과 다른 부분: ${a.reference_diff.map(esc).join(', ')}</div>` : ''}</details>` : ''}
    ${it.improved_answer ? `<details><summary>내 답변 다듬기</summary><div class="pre">${esc(it.improved_answer)}</div><button class="mini" data-act="say" data-text="${esc(it.improved_answer)}">듣기</button></details>` : ''}
    ${it.model_answer ? `<details><summary>모범 답안</summary><div class="pre">${esc(it.model_answer)}</div><button class="mini" data-act="say" data-text="${esc(it.model_answer)}">듣기</button></details>` : ''}
  </div>`;
}

/* ═══════════════ 기록 ═══════════════ */
function renderLog() {
  const h = history(), p = phrases();
  const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  view.innerHTML = `
    <h1>기록</h1>
    <h2>연습 기록</h2>
    ${h.length ? h.slice(0, 40).map((e) => `<div class="card rowb" style="padding:10px 14px"><div><b>${e.kind === 'toeic' ? esc(e.label) : esc((SCENARIOS.find((s) => s.id === e.scenario) || {}).name || '회화')}</b><div class="sub">${fmt(e.date)}${e.kind === 'talk' ? ` · ${e.turns}턴` : ''}</div></div>${e.kind === 'toeic' ? `<span class="badge ${e.sum / e.max >= 0.8 ? 'hi' : e.sum / e.max <= 0.4 ? 'lo' : ''}">${e.sum}/${e.max}</span>` : ''}</div>`).join('') : '<p class="sub">아직 기록이 없어요.</p>'}
    <h2>표현 노트 <span class="sub">(${p.length})</span></h2>
    ${p.length ? p.slice(0, 80).map((x, i) => `<div class="card rowb" style="padding:10px 14px"><div style="flex:1"><b>${esc(x.en)}</b><div class="sub">${esc(x.ko)}</div></div><button class="mini" data-act="say" data-text="${esc(x.en)}">듣기</button><button class="mini" data-act="delPhrase" data-i="${i}">삭제</button></div>`).join('') : '<p class="sub">대화하면서 나온 유용한 표현이 여기에 쌓여요.</p>'}`;
}

/* ═══════════════ 설정 ═══════════════ */
function renderSettings() {
  TTS.load();
  view.innerHTML = `
    <h1>설정</h1>
    <div class="card">
      <b>음성 (영어 읽어주기)</b>
      <div style="height:8px"></div>
      <select id="voiceSel"><option value="">자동 선택</option>${TTS.voices.map((v) => `<option value="${esc(v.voiceURI)}" ${settings.voiceURI === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>
      <div style="height:12px"></div>
      <div class="rowb"><span>속도</span><span class="sub" id="rateVal">${settings.rate.toFixed(2)}x</span></div>
      <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${settings.rate}">
      <div style="height:8px"></div>
      <button class="btn sec" data-act="say" data-text="Hello! Let's practice speaking English together.">들어보기</button>
    </div>
    <div class="card">
      <label class="tg" style="padding:0"><span><b>AI 말 자동 읽어주기</b><br><span class="sub">끄면 회화에서 소리가 나지 않아요. 필요할 때 '다시 듣기'로 들을 수 있어요. 토스 연습의 문제 음성은 계속 나와요.</span></span><input type="checkbox" id="autoRead" ${settings.autoRead !== false ? 'checked' : ''}></label>
    </div>
    <div class="card">
      <b>기본 난이도 (회화)</b><div style="height:8px"></div>
      <div class="seg">${LEVELS.map((l) => `<button class="${settings.level === l.id ? 'on' : ''}" data-act="defLvl" data-id="${l.id}">${l.name}</button>`).join('')}</div>
    </div>
    <div class="card">
      <b>계정</b><p class="sub">비밀번호는 이 기기에만 저장돼요.</p>
      <button class="btn sec" data-act="logout">비밀번호 다시 입력</button>
      <div style="height:8px"></div>
      <button class="btn ghost" data-act="wipe">대화·기록·표현 노트 모두 지우기</button>
    </div>`;
  $('#autoRead').onchange = (e) => { settings.autoRead = e.target.checked; saveSettings(); if (!settings.autoRead) TTS.cancel(); };
  $('#voiceSel').onchange = (e) => { settings.voiceURI = e.target.value; saveSettings(); };
  $('#rate').oninput = (e) => { settings.rate = +e.target.value; $('#rateVal').textContent = settings.rate.toFixed(2) + 'x'; saveSettings(); };
}

/* ───────────── 이벤트 ───────────── */
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('#tabs button');
  if (tabBtn) { go(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, d = el.dataset;
  switch (act) {
    case 'scn': talk.scenario = d.id; renderTalk(); break;
    case 'lvl': talk.level = d.id; renderTalk(); break;
    case 'talkStart': talkStart(); break;
    case 'talkNew': talk.phase = 'setup'; talk.msgs = []; renderTalk(); break;
    case 'talkEnd': talkEnd(); break;
    case 'mic': talkMic(); break;
    case 'hint': talkHint(); break;
    case 'hintClose': talk.hints = null; renderTalk(); break;
    case 'typeToggle': talk.typing = !talk.typing; renderTalk(); if (talk.typing) setTimeout(() => { const i = $('#txt'); if (i) i.focus(); }, 30); break;
    case 'askToggle': { const m = talk.msgs[+d.i]; if (m) { m.askOpen = true; renderTalk(); const f = document.querySelector(`.askForm[data-i="${d.i}"] input`); if (f) f.focus(); } break; }
    case 'savePhrase': addPhrases([{ en: d.en, ko: d.ko }]); el.textContent = '저장됨'; el.disabled = true; el.removeAttribute('data-act'); toast('노트에 저장했어요'); break;
    case 'convOpen': talkResume(d.id, false); break;
    case 'convReview': talkResume(d.id, true); break;
    case 'convDel': if (confirm('이 대화를 지울까요?')) { store.set('ec_convs', convs().filter((c) => c.id !== d.id)); renderTalk(); } break;
    case 'markOpen': { const pn = document.getElementById(d.id); if (pn) pn.classList.toggle('hidden'); break; }
    case 'phraseOpen': { const pn = document.getElementById('ph' + d.i); if (pn) pn.classList.toggle('hidden'); break; }
    case 'speakMsg': TTS.speak(talk.msgs[+d.i].content); break;
    case 'say': unlockAudio(); TTS.speak(d.text); break;
    case 'toeicStart': toeicStart(d.type); break;
    case 'toeicGo': toeicGo(); break;
    case 'toeicHome': toeic.phase = 'home'; toeic.sess = null; renderToeic(); break;
    case 'skip': if (toeic.sess && toeic.sess.skip) toeic.sess.skip(); break;
    case 'stopRec': if (toeic.sess && toeic.sess.stopRec) toeic.sess.stopRec(); break;
    case 'abort': abortToeic(); renderToeic(); break;
    case 'delPhrase': { const p = phrases(); p.splice(+d.i, 1); store.set('ec_phrases', p); renderLog(); break; }
    case 'defLvl': settings.level = d.id; talk.level = d.id; saveSettings(); renderSettings(); break;
    case 'logout': password = ''; store.set('ec_pw', ''); showLogin(); break;
    case 'wipe': if (confirm('저장된 대화, 기록, 표현 노트를 모두 지울까요?')) { store.set('ec_history', []); store.set('ec_phrases', []); store.set('ec_convs', []); toast('지웠어요'); } break;
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest && e.target.closest('.askForm');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('.askTxt');
  const q = inp ? inp.value : '';
  if (q.trim()) talkAsk(+f.dataset.i, q);
});

$('#pwGo').onclick = async () => {
  const v = $('#pw').value;
  if (!v) return;
  password = v;
  try {
    await api('/api/claude', { task: 'ping' });
    store.set('ec_pw', v);
    $('#login').classList.add('hidden');
    $('#pw').value = '';
    render();
  } catch (e) { toast(e.message); }
};
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#pwGo').click(); });

/* ───────────── 시작 ───────────── */
document.querySelector('#tabs button[data-tab="talk"]').classList.add('on');
render();
if (!password) showLogin();
})();
</script>
</body>
</html>
